name: Build Native Windows 11 App & Installer

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10 LTS SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Setup Node.js 22 (reference web tests)
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup -y

      - name: Build native WinUI 3 HAFIZ.exe, run xUnit & Python tests, and package HAFIZ_Setup.exe
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Configuration Release

      - name: Runtime smoke-test published app and installed setup package
        shell: pwsh
        run: ./scripts/smoke-test-windows.ps1 -PublishDirectory artifacts/win-x64/publish -InstallerPath artifacts/installer/HAFIZ_Setup.exe

      - name: Upload Native Windows Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: HAFIZ-Windows11-x64
          path: |
            artifacts/win-x64/publish/**
            artifacts/installer/HAFIZ_Setup.exe
            artifacts/SHA256SUMS.txt
